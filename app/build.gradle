plugins {
    id 'com.android.application'
}

android {
    namespace 'net.appinn.firetvbtdiag'
    compileSdk 35

    defaultConfig {
        applicationId 'net.appinn.firetvbtdiag'
        minSdk 28
        targetSdk 30
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
